<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipariş Bildirimleri - Uzay Market</title>
<style>
  :root{
    --space-deep:#0B2545;
    --green:#2E8B57;
    --green-dark:#1F6B42;
    --cream:#FAF9F6;
    --border:#E4E1D8;
    --red:#C0392B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Poppins', sans-serif;
    background:var(--cream);
    color:#222;
    padding:16px;
    max-width:640px;
    margin:0 auto;
  }
  h1{
    font-size:1.3rem;
    color:var(--space-deep);
    margin-bottom:4px;
  }
  .status{
    font-size:0.82rem;
    color:var(--green-dark);
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .status .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--green);
  }
  .enable-sound-btn{
    width:100%;
    padding:14px;
    background:var(--space-deep);
    color:#fff;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    margin-bottom:20px;
  }
  .order-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    animation:pop 0.3s ease;
  }
  .order-card.new{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(46,139,87,0.15);
  }
  @keyframes pop{
    from{ transform:scale(0.96); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  .order-time{
    font-size:0.75rem;
    color:#888;
    margin-bottom:8px;
  }
  .order-items{
    font-size:0.88rem;
    line-height:1.6;
    margin-bottom:8px;
  }
  .order-total{
    font-weight:800;
    color:var(--green-dark);
    font-size:1rem;
  }
  .order-location a{
    display:inline-block;
    margin-top:8px;
    font-size:0.82rem;
    color:var(--space-deep);
    font-weight:600;
  }
  .empty-msg{
    text-align:center;
    color:#999;
    padding:40px 20px;
    font-size:0.9rem;
  }
</style>
</head>
<body>

<h1>🚀 Sipariş Bildirimleri</h1>
<div class="status"><span class="dot"></span> Canlı dinleniyor — bu sekmeyi açık tutun</div>

<button class="enable-sound-btn" id="enableSoundBtn">🔔 Bildirim Sesini Aktif Et</button>

<div id="ordersList">
  <div class="empty-msg" id="emptyMsg">Henüz sipariş yok. Yeni sipariş geldiğinde burada görünecek.</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onChildAdded, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCK_GKKyE3HpGtJggE-c6iNsVwhea-H7Jo",
    authDomain: "uzay-market.firebaseapp.com",
    databaseURL: "https://uzay-market-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "uzay-market",
    storageBucket: "uzay-market.firebasestorage.app",
    messagingSenderId: "849512127212",
    appId: "1:849512127212:web:30ed9f1a64dc960ab6e3c9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  var soundEnabled = false;
  var pageLoadTime = Date.now();
  var audioCtx = null;

  document.getElementById('enableSoundBtn').addEventListener('click', function(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    soundEnabled = true;
    this.textContent = '✅ Bildirim Sesi Aktif';
    this.disabled = true;
    this.style.background = 'var(--green)';
    playBeep(); // test sesi
  });

  function playBeep(){
    if(!audioCtx) return;
    for(var i=0; i<3; i++){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime + i*0.35);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.35 + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + i*0.35);
      osc.stop(audioCtx.currentTime + i*0.35 + 0.3);
    }
  }

  function formatPrice(n){
    return n.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ₺';
  }

  var ordersRef = query(ref(db, 'orders'), limitToLast(30));

  onChildAdded(ordersRef, function(snapshot){
    var order = snapshot.val();
    var emptyMsg = document.getElementById('emptyMsg');
    if(emptyMsg) emptyMsg.remove();

    var isNew = order.createdAt && order.createdAt > pageLoadTime;

    var card = document.createElement('div');
    card.className = 'order-card' + (isNew ? ' new' : '');

    var itemsHtml = '';
    if(order.items){
      order.items.forEach(function(it){
        itemsHtml += it.qty + 'x ' + it.name + '<br>';
      });
    }

    var timeStr = order.createdAt ? new Date(order.createdAt).toLocaleString('tr-TR') : '';

    card.innerHTML =
      '<div class="order-time">' + timeStr + '</div>' +
      '<div class="order-items">' + itemsHtml + '</div>' +
      '<div class="order-total">Toplam: ' + formatPrice(order.total || 0) + '</div>' +
      (order.locationLink ? '<div class="order-location"><a href="' + order.locationLink + '" target="_blank">📍 Konumu Gör</a></div>' : '');

    document.getElementById('ordersList').prepend(card);

    if(isNew && soundEnabled){
      playBeep();
      if('vibrate' in navigator) navigator.vibrate([200,100,200]);
    }
  });
</script>

</body>
</html>
