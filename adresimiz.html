<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adresimiz | Uzay Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --space-deep:#0B2545;
    --green:#2E8B57;
    --green-light:#EAF6EF;
    --gold:#FFC145;
    --cream:#FDFDFB;
    --ink:#1C1C1A;
    --border:#E3E3DD;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.7;
  }
  h1{font-family:'Poppins', sans-serif;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 6%;
    background:var(--space-deep);
  }
  .logo{font-weight:800; font-size:1.1rem; color:#fff;}
  .logo .accent{color:var(--gold);}
  .back-link{
    color:#fff;
    text-decoration:none;
    font-size:0.8rem;
    font-weight:600;
    border:1px solid rgba(255,255,255,0.3);
    padding:9px 18px;
    border-radius:20px;
  }
  main{
    max-width:560px;
    margin:0 auto;
    padding:60px 24px 100px;
  }
  .eyebrow{
    color:var(--green);
    text-transform:uppercase;
    letter-spacing:0.2em;
    font-size:0.72rem;
    font-weight:700;
    display:block;
    text-align:center;
    margin-bottom:14px;
  }
  h1{
    font-weight:800;
    font-size:clamp(1.8rem,4vw,2.4rem);
    text-align:center;
    color:var(--space-deep);
    margin-bottom:36px;
  }
  .address-box{
    background:#fff;
    border:1.5px dashed var(--green);
    border-radius:14px;
    padding:30px 24px;
    text-align:center;
    color:#6B6B66;
    font-weight:500;
    margin-bottom:20px;
  }
  .map-placeholder{
    aspect-ratio:16/10;
    background:var(--green-light);
    border:1.5px dashed var(--green);
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#1F5C3A;
    font-weight:600;
    text-align:center;
    padding:20px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🚀 Uzay <span class="accent">Market</span></div>
  <a href="index.html" class="back-link">Anasayfaya Dön</a>
</header>

<main>
  <span class="eyebrow">Adresimiz</span>
  <h1>Bizi Ziyaret Edin</h1>

  <div class="address-box">
    [Mağaza adresiniz buraya eklenecek]
  </div>

  <div class="map-placeholder">
    Harita Alanı<br>(Adresiniz eklendiğinde Google Haritalar burada görünecek)
  </div>
</main>

</body>
</html>
