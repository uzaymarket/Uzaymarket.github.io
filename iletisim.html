<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İletişim | Uzay Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --space-deep:#0B2545;
    --green:#2E8B57;
    --green-dark:#1F5C3A;
    --green-light:#EAF6EF;
    --gold:#FFC145;
    --cream:#FDFDFB;
    --ink:#1C1C1A;
    --border:#E3E3DD;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.7;
  }
  h1{font-family:'Poppins', sans-serif;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 6%;
    background:var(--space-deep);
  }
  .logo{font-weight:800; font-size:1.1rem; color:#fff;}
  .logo .accent{color:var(--gold);}
  .back-link{
    color:#fff;
    text-decoration:none;
    font-size:0.8rem;
    font-weight:600;
    border:1px solid rgba(255,255,255,0.3);
    padding:9px 18px;
    border-radius:20px;
  }
  main{
    max-width:560px;
    margin:0 auto;
    padding:60px 24px 100px;
  }
  .eyebrow{
    color:var(--green);
    text-transform:uppercase;
    letter-spacing:0.2em;
    font-size:0.72rem;
    font-weight:700;
    display:block;
    text-align:center;
    margin-bottom:14px;
  }
  h1{
    font-weight:800;
    font-size:clamp(1.8rem,4vw,2.4rem);
    text-align:center;
    color:var(--space-deep);
    margin-bottom:40px;
  }
  .contact-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:16px;
    text-decoration:none;
    color:var(--ink);
  }
  .contact-icon{
    width:48px; height:48px;
    background:var(--green-light);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.3rem;
    flex-shrink:0;
  }
  .contact-label{font-size:0.75rem; color:#6B6B66; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;}
  .contact-value{font-size:1rem; font-weight:700; color:var(--space-deep); margin-top:2px;}
  .whatsapp-cta{
    display:block;
    text-align:center;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    font-weight:800;
    padding:16px;
    border-radius:12px;
    margin-top:24px;
    font-size:0.95rem;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🚀 Uzay <span class="accent">Market</span></div>
  <a href="index.html" class="back-link">Anasayfaya Dön</a>
</header>

<main>
  <span class="eyebrow">İletişim</span>
  <h1>Bize Ulaşın</h1>

  <a href="tel:+905398490035" class="contact-card">
    <div class="contact-icon">📞</div>
    <div>
      <div class="contact-label">Telefon</div>
      <div class="contact-value">0539 849 00 35</div>
    </div>
  </a>

  <a href="https://wa.me/905398490035" target="_blank" class="contact-card">
    <div class="contact-icon">💬</div>
    <div>
      <div class="contact-label">WhatsApp</div>
      <div class="contact-value">Mesaj Gönder</div>
    </div>
  </a>

  <a href="adresimiz.html" class="contact-card">
    <div class="contact-icon">📍</div>
    <div>
      <div class="contact-label">Adres</div>
      <div class="contact-value">Adresimizi Görüntüle</div>
    </div>
  </a>

  <a href="tel:+905398490035" class="whatsapp-cta">Hemen Ara</a>
</main>

</body>
</html>
